# version: "3.9"
services:
  bot:
    build: ./bot
    env_file:
      - .env
      - .env.secrets
    image: crypto-bot-bot:1.1.0
    container_name: crypto-bot-bot
    ports:
      - "${METRICS_PORT:-9101}:${METRICS_PORT:-9101}"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: crypto-bot-prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts:/etc/prometheus/alerts:ro
      - ./data/prometheus:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - alertmanager
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: crypto-bot-alertmanager
    volumes:
      - ./infra/alertmanager/config.yml:/etc/alertmanager/config.yml:ro
    ports:
      - "9093:9093"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: crypto-bot-grafana
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD:-admin123}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards
      - ./infra/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  default:
    driver: bridge