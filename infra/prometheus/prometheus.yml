global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts/alerts.yml

scrape_configs:
  - job_name: bot
    static_configs:
      - targets: ["bot:9101"]
      
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]